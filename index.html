<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4e3de" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Crate">
<title>Crate</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' font-size='90' text-anchor='middle' dominant-baseline='central'>💿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --paper: #e4e3de; --ink: #141414; --muted: #5d5c57; --rule: #bfbdb5;
    --field: #efeeea; --accent: #8e1b1b; --accent-ink: #ffffff;
    --got: #2e7d32; --got-ink: #ffffff;
    --now: #2f7fd8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #1b1b19; --ink: #e8e6e0; --muted: #9b998f; --rule: #3b3a35;
      --field: #242421; --accent: #d2493a; --accent-ink: #140a08;
      --got: #5cb860; --got-ink: #0c1a0d;
      --now: #5aa9f5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: Archivo, "Helvetica Neue", Arial, sans-serif; line-height: 1.5;
  }
  .wrap { max-width: 140rem; margin: 0 auto; padding: 2rem clamp(1rem, 3vw, 3rem) 4rem; }

  header {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 1.5rem; border-bottom: 3px solid var(--ink); padding-bottom: 1rem;
  }
  h1 {
    margin: 0; font-size: clamp(4.5rem, 15vw, 9.5rem); line-height: .78;
    font-weight: 900; font-stretch: 62%; letter-spacing: -.01em;
  }
  header .tag { margin: .6rem 0 0; color: var(--muted); }
  .run { display: flex; flex-direction: column; align-items: flex-end; gap: .4rem; }

  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #runBtn {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 2px;
    padding: .9rem 1.6rem; font-weight: 800; font-size: 1.15rem; font-stretch: 75%;
  }
  #runBtn:disabled { opacity: .6; cursor: progress; }
  #status { color: var(--muted); font-size: .9rem; min-height: 1.4em; text-align: right; max-width: 28rem; }
  #status.err { color: var(--accent); }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) clamp(18rem, 22vw, 24rem); gap: clamp(1.5rem, 3vw, 3rem); margin-top: 2rem; }
  @media (max-width: 52rem) {
    .grid { grid-template-columns: 1fr; }
    .run { align-items: flex-start; }
    #status { text-align: left; }
  }
  h2 { font-size: 1.5rem; font-weight: 800; font-stretch: 75%; margin: 0 0 .75rem; }
  #picksMeta { color: var(--muted); margin: -.5rem 0 1rem; font-size: .9rem; }

  .md { overflow-x: auto; }
  .md table { border-collapse: collapse; width: 100%; font-size: .95rem; }
  .md th, .md td { text-align: left; vertical-align: top; padding: .6rem .7rem; border-bottom: 1px solid var(--rule); }
  .md th { border-bottom: 2px solid var(--ink); font-weight: 800; }
  .md td:first-child:not(.mark), .md td.mark + td { font-weight: 700; }
  .md a { color: var(--accent); }
  .md td.listen { white-space: nowrap; }
  .md td.mark { width: 1%; white-space: nowrap; padding-top: .45rem; }
  .md td.mark button {
    background: none; color: var(--muted); border: 1px solid var(--rule); border-radius: 2px;
    display: inline-flex; align-items: center; justify-content: center; vertical-align: top;
    height: 1.6rem; padding: 0 .45rem; font-size: .8rem; font-weight: 700; line-height: 1;
  }
  .md td.mark button + button { margin-left: .3rem; }
  .md td.mark button:hover { color: var(--ink); border-color: var(--ink); }
  .md td.mark button[data-mark="got"][aria-pressed="true"] { background: var(--got); border-color: var(--got); color: var(--got-ink); }
  .md td.mark button[data-mark="pass"][aria-pressed="true"] { background: var(--muted); border-color: var(--muted); color: var(--paper); }
  .md tr.is-got td { background: color-mix(in srgb, var(--got) 16%, transparent); }
  .md tr.is-got td.mark { box-shadow: inset 4px 0 0 var(--got); }
  .md tr.is-pass td { background: color-mix(in srgb, var(--muted) 18%, transparent); }
  .md tr.is-pass td.mark { box-shadow: inset 4px 0 0 var(--muted); }
  .md td.mark button[data-mark="love"] { width: 1.6rem; padding: 0; font-size: .95rem; }
  .md td.mark button[data-mark="love"][aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .md tr.is-love td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .md tr.is-love td.mark { box-shadow: inset 4px 0 0 var(--accent); }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .md p, .md li { max-width: 70ch; }

  .ghost {
    background: none; border: 2px solid var(--ink); color: var(--ink);
    padding: .45rem .9rem; font-weight: 700; border-radius: 2px;
  }
  #history button {
    width: 100%; text-align: left; background: none; border: 0; color: var(--ink);
    border-bottom: 1px solid var(--rule); padding: .55rem 0;
  }
  #history button[aria-current="true"] { font-weight: 800; color: var(--accent); }
  .empty { color: var(--muted); }

  .search { margin-bottom: 2rem; }
  #search {
    width: 100%; font: inherit; padding: .55rem .7rem; background: var(--field); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 2px;
  }
  #search:focus { border-color: var(--ink); }
  .meta-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1rem; margin: -.5rem 0 1rem; }
  .meta-row #picksMeta { margin: 0; }
  .link {
    background: none; border: 0; padding: 0; color: var(--muted); font-size: .9rem;
    text-decoration: underline; text-underline-offset: .2em;
  }
  .link:hover { color: var(--ink); }
  .link.danger:hover { color: var(--accent); }
  .md td.from { white-space: nowrap; }
  .md td.from .link { font-size: inherit; }
  #archivedBox { margin-top: 1.5rem; }
  #archivedBox summary { cursor: pointer; font-weight: 700; color: var(--muted); }
  #archivedBox[open] summary { margin-bottom: .4rem; }
  #history, #archived { list-style: none; margin: 0; padding: 0; }
  #archived button {
    width: 100%; text-align: left; background: none; border: 0; color: var(--muted);
    border-bottom: 1px solid var(--rule); padding: .55rem 0;
  }
  #archived button[aria-current="true"] { font-weight: 800; color: var(--accent); }

  #nextRun { margin: 0; color: var(--muted); font-size: .9rem; text-align: right; }
  #nextRun a { color: var(--muted); }
  #nextRun a:hover { color: var(--ink); }
  @media (max-width: 52rem) { #nextRun { text-align: left; } }
  /* Preview playlist: a bar above the list, Play links in rows, and a player pinned to the bottom. */
  .md td.listen .link { font-size: inherit; color: var(--accent); }
  /* The album being previewed: light blue, over any Got/Pass/♥ tint, until the player moves on. */
  .md tr.is-playing td { background: color-mix(in srgb, var(--now) 20%, transparent); }
  .md tr.is-playing td.mark { box-shadow: inset 4px 0 0 var(--now); }

  .playlist {
    margin-bottom: 2rem; padding: 1rem 1rem .8rem; background: var(--field);
    border: 1px solid var(--rule); border-top: 3px solid var(--ink); border-radius: 2px;
  }
  .pl-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  .pl-head h2 { margin: 0; }
  #plCount { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #previewMsg { color: var(--muted); font-size: .85rem; margin: .2rem 0 .7rem; }
  #previewMsg:empty { display: none; }
  .pl-progress { height: 3px; background: var(--rule); margin: 0 0 .8rem; overflow: hidden; }
  .pl-progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  #playAllBtn {
    width: 100%; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 2px;
    padding: .6rem 1rem; font-weight: 800; font-stretch: 80%; font-size: 1rem; letter-spacing: .01em;
  }
  #playAllBtn:hover { filter: brightness(1.08); }
  #songs {
    list-style: none; margin: .8rem -.4rem 0; padding: 0 0 .3rem; font-size: .9rem;
    max-height: 15rem; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding-top: .5rem;
  }
  #songs > li + li { margin-top: .7rem; }
  #songs > li[data-key] { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr); gap: .15rem .45rem; padding-left: .4rem; }
  .cover {
    width: 3.4rem; height: 3.4rem; object-fit: cover; border-radius: 2px; margin-top: .1rem;
    background: var(--rule); box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 10%, transparent);
  }
  .album-body { min-width: 0; }
  .album-head { display: flex; align-items: baseline; gap: .5rem; padding: 0 .4rem .15rem; }
  .album-head .names { flex: 1; min-width: 0; line-height: 1.25; }
  .album-head .al { display: block; font-weight: 800; font-stretch: 85%; }
  .album-head .ar { display: block; color: var(--muted); font-size: .8rem; }
  .album-head .tag {
    font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
    padding: .05rem .35rem; border-radius: 2px; color: var(--paper); background: var(--muted);
  }
  .album-head .tag[data-mark="got"] { background: var(--got); color: var(--got-ink); }
  .album-head .tag[data-mark="love"] { background: var(--accent); color: var(--accent-ink); }
  .tracks { list-style: none; margin: 0; padding: 0; }
  .tracks button {
    display: flex; align-items: center; gap: .55rem; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 2px; padding: .3rem .4rem; color: var(--ink);
  }
  .tracks button:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .tracks .n { width: 1.3rem; flex: none; text-align: right; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .tracks .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tracks .eq { display: none; width: 1.3rem; flex: none; height: .8rem; align-items: flex-end; justify-content: flex-end; gap: 2px; }
  .tracks .eq i { width: 3px; height: 100%; background: var(--now); }
  .tracks li.is-current .n { display: none; }
  .tracks li.is-current .eq { display: flex; }
  .tracks li.is-current button { background: color-mix(in srgb, var(--now) 20%, transparent); }
  .tracks li.is-current .t { font-weight: 700; }
  #songs > li.is-marked .album-head .names, #songs > li.is-marked .tracks, #songs > li.is-marked .cover { opacity: .5; }
  #songs li.note { color: var(--muted); font-size: .8rem; padding: 0 .4rem; }
  #songs li.note + li.note { margin-top: .2rem; }
  .pl-foot { margin-top: .8rem; padding-top: .6rem; border-top: 1px solid var(--rule); }
  .pl-foot .link { font-size: .85rem; }
  @media (prefers-reduced-motion: no-preference) {
    body:not(.is-paused) .tracks li.is-current .eq i { animation: eq .9s ease-in-out infinite; }
    .tracks .eq i:nth-child(2) { animation-delay: -.3s !important; }
    .tracks .eq i:nth-child(3) { animation-delay: -.6s !important; }
    @keyframes eq { 0%, 100% { height: 30%; } 50% { height: 100%; } }
  }
  body.has-player { padding-bottom: 6.5rem; }
  #player {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem;
    padding: .7rem clamp(1rem, 3vw, 3rem); background: var(--field); border-top: 3px solid var(--ink);
  }
  #player[hidden] { display: none; }
  #player .np { flex: 1 1 14rem; min-width: 0; }
  #npArt { width: 2.8rem; height: 2.8rem; object-fit: cover; border-radius: 2px; flex: none; background: var(--rule); }
  #npTitle { display: block; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #npSub { display: block; color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #player audio { flex: 2 1 18rem; min-width: 0; height: 2.4rem; }
  #player .ctl {
    background: none; border: 1px solid var(--rule); color: var(--ink); border-radius: 2px;
    min-width: 2.4rem; height: 2.4rem; font-size: 1rem; font-weight: 700;
  }
  #player .ctl:hover { border-color: var(--ink); }
  @media (prefers-reduced-motion: no-preference) {
    #runBtn.busy { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .75; } }
  }

  /* ---------- Phones and narrow tablets ---------- */
  @media (max-width: 52rem) {
    /* One column: Playlist first, then the picks, then search and the lists of runs. */
    .grid { display: flex; flex-direction: column; gap: 1.75rem; }
    aside { display: contents; }
    #playlistBox { order: -1; margin-bottom: 0; }
    main { order: 0; }
    .search { order: 1; margin-bottom: 0; }
    aside > section:not(.search):not(.playlist), #archivedBox { order: 2; }
    #songs { max-height: 50vh; }
  }

  @media (max-width: 40rem) {
    .wrap { padding: calc(1rem + env(safe-area-inset-top)) 1rem 3rem; }
    header { align-items: center; gap: .75rem; padding-bottom: .75rem; }
    h1 { font-size: 3.6rem; }
    header .tag { display: none; }
    .run { align-items: stretch; flex: 1 1 100%; }
    #runBtn { padding: .7rem 1rem; font-size: 1rem; }
    #status, #nextRun { text-align: left; }
    #status:empty { display: none; }
    .run { gap: .5rem; }
    .grid { margin-top: 1.25rem; }
    h2 { font-size: 1.3rem; }

    /* Picks as cards */
    .md table, .md tbody, .md tr, .md td { display: block; }
    .md table { font-size: .95rem; }
    .md thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .md tr {
      display: grid; grid-template-columns: 1fr auto; column-gap: .75rem;
      padding: .85rem .9rem .9rem; margin-bottom: .75rem;
      background: var(--field); border: 1px solid var(--rule); border-left: 4px solid var(--rule); border-radius: 3px;
    }
    .md tr td { grid-column: 1 / -1; padding: 0; border: 0; background: none !important; box-shadow: none !important; }
    .md td.col-album { grid-row: 1; grid-column: 1; font-weight: 800; font-size: 1.08rem; font-stretch: 90%; line-height: 1.25; }
    .md td.col-year { grid-row: 1; grid-column: 2; color: var(--muted); font-size: .85rem; align-self: baseline; }
    .md td.col-artist, .md td.mark + td.col-artist { grid-row: 2; font-weight: 600; margin-top: .1rem; }
    .md td.col-why {
      grid-row: 3; margin-top: .5rem; color: var(--muted); font-size: .88rem; line-height: 1.45;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; cursor: pointer;
    }
    .md td.col-why.open { -webkit-line-clamp: unset; display: block; }
    .md td.listen { grid-row: 4; margin-top: .6rem; white-space: normal; font-size: .9rem; }
    .md td.mark { grid-row: 5; width: auto; display: flex; gap: .45rem; margin-top: .75rem; padding: 0; }
    .md td.mark button { flex: 1; height: 2.6rem; font-size: .95rem; }
    .md td.mark button + button { margin-left: 0; }
    .md td.mark button[data-mark="love"] { flex: 0 0 3rem; width: auto; font-size: 1.1rem; }
    .md td.from { grid-row: 6; margin-top: .5rem; font-size: .85rem; }

    /* Marks and "now playing" tint the whole card */
    .md tr.is-got { background: color-mix(in srgb, var(--got) 14%, var(--field)); border-color: color-mix(in srgb, var(--got) 45%, var(--rule)); border-left-color: var(--got); }
    .md tr.is-pass { background: color-mix(in srgb, var(--muted) 16%, var(--field)); border-left-color: var(--muted); }
    .md tr.is-love { background: color-mix(in srgb, var(--accent) 10%, var(--field)); border-left-color: var(--accent); }
    .md tr.is-playing { background: color-mix(in srgb, var(--now) 18%, var(--field)); border-color: color-mix(in srgb, var(--now) 50%, var(--rule)); border-left-color: var(--now); }

    .meta-row { gap: .25rem .9rem; }

    /* Playlist card: room to breathe, bigger touch targets */
    .playlist { padding: .9rem .9rem .7rem; }
    #playAllBtn { padding: .8rem 1rem; font-size: 1.05rem; }
    .tracks button { padding: .55rem .4rem; }
    #songs > li[data-key] { grid-template-columns: 3.8rem minmax(0, 1fr); }
    .cover { width: 3.8rem; height: 3.8rem; }
    #songs { max-height: 45vh; }

    /* Player: artwork, song and close on top; previous, seek bar and next below. Clears the home bar. */
    #player {
      display: grid; grid-template-columns: auto 1fr auto; gap: .5rem .7rem; align-items: center;
      grid-template-areas: "art np close" "prev audio next";
      padding: .6rem 1rem calc(.6rem + env(safe-area-inset-bottom));
    }
    #player[hidden] { display: none; }
    #npArt { grid-area: art; width: 2.6rem; height: 2.6rem; }
    #player .np { grid-area: np; }
    #closePlayer { grid-area: close; }
    #prevBtn { grid-area: prev; }
    #nextBtn { grid-area: next; }
    #player audio { grid-area: audio; width: 100%; height: 2.4rem; }
    #player .ctl { min-width: 2.75rem; height: 2.75rem; }
    body.has-player { padding-bottom: calc(9rem + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Crate</h1>
      <p class="tag">Album picks from what you’ve been playing.</p>
    </div>
    <div class="run">
      <button id="runBtn">Dig up new picks</button>
      <div id="status" role="status"></div>
      <p id="nextRun"><span id="nextRunText"></span> <a href="/settings">Settings</a></p>
    </div>
  </header>

  <div class="grid">
    <main>
      <h2 id="picksTitle">Latest picks</h2>
      <div class="meta-row">
        <p id="picksMeta"></p>
        <button class="link" id="archiveBtn" hidden>Archive this list</button>
        <button class="link" id="restoreBtn" hidden>Restore</button>
        <button class="link danger" id="deleteBtn" hidden>Delete permanently</button>
      </div>
      <div id="picks" class="md">
        <p class="empty">No picks yet. Press “Dig up new picks” to run your prompt.</p>
      </div>
    </main>

    <aside>
      <section class="search" role="search">
        <label for="search"><h2>Search</h2></label>
        <input id="search" type="search" placeholder="Artist, album, genre…" autocomplete="off">
      </section>
      <section id="playlistBox" class="playlist" hidden aria-labelledby="playlistHead">
        <div class="pl-head">
          <h2 id="playlistHead">Playlist</h2>
          <span id="plCount"></span>
        </div>
        <p id="previewMsg" role="status"></p>
        <div class="pl-progress" id="plProgress" hidden><span></span></div>
        <button id="playAllBtn" hidden>▶ Play all</button>
        <ol id="songs" aria-label="Songs in this playlist"></ol>
        <div class="pl-foot"><button class="link" id="makePlaylistBtn" hidden>Make playlist</button></div>
      </section>
      <section>
        <h2>Earlier picks</h2>
        <ul id="history"></ul>
      </section>
      <details id="archivedBox" hidden>
        <summary>Archived (<span id="archivedCount">0</span>)</summary>
        <ul id="archived"></ul>
      </details>
    </aside>
  </div>
</div>

<div id="player" hidden>
  <img id="npArt" alt="" hidden>
  <div class="np"><span id="npTitle"></span><span id="npSub"></span></div>
  <button class="ctl" id="prevBtn" aria-label="Previous song" title="Previous">⏮</button>
  <audio id="audio" controls preload="auto"></audio>
  <button class="ctl" id="nextBtn" aria-label="Next song" title="Next">⏭</button>
  <button class="ctl" id="closePlayer" aria-label="Stop and close the player" title="Close">✕</button>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  let poll = null;
  let current = null;                        // the run shown when not searching
  let lists = { active: [], archived: [] };  // run names, newest first
  let searchIndex = null;                    // parsed rows of every run, loaded on first search
  let searching = false;

  async function api(path, opts = {}) {
    const r = await fetch(path, opts);
    if (!r.ok) {
      let msg = await r.text();
      try { msg = JSON.parse(msg).detail || msg; } catch {}
      throw new Error(msg || r.statusText);
    }
    return (r.headers.get("content-type") || "").includes("json") ? r.json() : r.text();
  }

  function niceName(n) {
    const [d, t] = n.replace(".md", "").split("_");
    return `${d} at ${t.slice(0, 2)}:${t.slice(2)}`;
  }

  function setStatus(msg, isError = false) {
    $("#status").textContent = msg;
    $("#status").classList.toggle("err", isError);
  }

  // Turn the Bandcamp column into a "Listen" column with Bandcamp + YouTube search links.
  function addListenLinks(root) {
    root.querySelectorAll("table").forEach((table) => {
      const ths = [...table.querySelectorAll("thead th")];
      const heads = ths.map((th) => th.textContent.trim().toLowerCase());
      const ai = heads.indexOf("artist"), bi = heads.indexOf("album");
      if (ai < 0 || bi < 0) return;
      const yi = heads.indexOf("year"), wi = heads.findIndex((h) => h.startsWith("why"));
      table.querySelectorAll("tbody tr").forEach((tr) => {
        const c = tr.children;
        c[ai]?.classList.add("col-artist");
        c[bi]?.classList.add("col-album");
        if (yi >= 0) c[yi]?.classList.add("col-year");
        if (wi >= 0) {
          c[wi]?.classList.add("col-why");
          c[wi]?.addEventListener("click", (e) => { if (!e.target.closest("a")) c[wi].classList.toggle("open"); });
        }
      });
      let li = heads.indexOf("bandcamp");
      if (li < 0) {
        li = ths.length;
        table.querySelector("thead tr").append(document.createElement("th"));
      }
      table.querySelectorAll("thead th")[li].textContent = "Listen";
      table.querySelectorAll("tbody tr").forEach((tr) => {
        const cells = tr.children;
        if (!cells[ai] || !cells[bi]) return;
        const cell = cells[li] || tr.appendChild(document.createElement("td"));
        cell.classList.add("listen");
        const q = `${cells[ai].textContent.trim()} ${cells[bi].textContent.trim()}`;
        const link = (href, text) => Object.assign(document.createElement("a"), { href, textContent: text });
        // Built here rather than trusting the model's link, so every row searches albums only.
        cell.replaceChildren(
          link("https://bandcamp.com/search?" + new URLSearchParams({ q, item_type: "a" }), "Bandcamp"),
          " · ",
          link("https://www.youtube.com/results?" + new URLSearchParams({ search_query: q }), "YouTube"),
        );
      });
      addMarkButtons(table, ai, bi);
    });
  }

  // "Got" / "Pass" toggles at the start of each row, saved on the server.
  // Got strikes the row through; Pass fades it out. Pressing the active one clears it.
  let marks = {};
  const markKey = (artist, album) => `${artist}|${album}`.toLowerCase();

  function showMark(tr, mark) {
    tr.classList.toggle("is-got", mark === "got");
    tr.classList.toggle("is-pass", mark === "pass");
    tr.classList.toggle("is-love", mark === "love");
    tr.querySelectorAll(".mark button").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.mark === mark)));
  }

  function addMarkButtons(table, ai, bi) {
    const th = document.createElement("th");
    th.innerHTML = '<span class="visually-hidden">Mark</span>';
    table.querySelector("thead tr").prepend(th);
    table.querySelectorAll("tbody tr").forEach((tr) => {
      const artist = tr.children[ai]?.textContent.trim() || "";
      const album = tr.children[bi]?.textContent.trim() || "";
      const key = markKey(artist, album);
      Object.assign(tr.dataset, { key, artist, album });
      const td = document.createElement("td");
      td.className = "mark";
      for (const [mark, label, title] of [["got", "Got", "I got this"], ["love", "♥", "Loved it"], ["pass", "Pass", "Not interested"]]) {
        const b = document.createElement("button");
        b.type = "button";
        b.dataset.mark = mark;
        b.textContent = label;
        b.title = title;
        b.setAttribute("aria-label", `${title}: ${album} by ${artist}`);
        b.onclick = async () => {
          const before = marks[key] || null;
          const next = before === mark ? null : mark;
          showMark(tr, next);
          try {
            await api("/api/marks", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ key, mark: next }),
            });
            if (next) marks[key] = next; else delete marks[key];
            if (playlist) markSongs();
          } catch (e) {
            showMark(tr, before);
            setStatus(`Couldn’t save: ${e.message}`, true);
          }
        };
        td.append(b);
      }
      tr.prepend(td);
      showMark(tr, marks[key] || null);
    });
  }

  function renderPicks(content) {  // an HTML string, or a node to show as is
    if (typeof content === "string") $("#picks").innerHTML = content;
    else $("#picks").replaceChildren(content);
    addListenLinks($("#picks"));
    $("#picks").querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
  }

  // Title, "Run on …" line, Archive/Restore/Delete buttons and the sidebar highlight.
  function updateView() {
    const archived = lists.archived.includes(current);
    $("#picksTitle").textContent = searching ? "Search results"
      : archived ? "Archived picks"
      : current && current !== lists.active[0] ? "Earlier picks" : "Latest picks";
    if (!searching) $("#picksMeta").textContent = current ? `Run on ${niceName(current)}` : "";
    $("#archiveBtn").hidden = searching || !current || archived;
    if (searching || !current) $("#playlistBox").hidden = true;
    $("#restoreBtn").hidden = $("#deleteBtn").hidden = searching || !archived;
    document.querySelectorAll("#history button, #archived button").forEach((b) =>
      b.setAttribute("aria-current", String(!searching && b.dataset.name === current)));
  }

  async function showPick(name) {
    if (!name) {
      current = null;
      if (!searching) $("#picks").innerHTML = lists.archived.length
        ? '<p class="empty">No lists here. Archived lists are in the sidebar.</p>'
        : '<p class="empty">No picks yet. Press “Dig up new picks” to run your prompt.</p>';
      updateView();
      return;
    }
    const text = await api(`/api/picks/${encodeURIComponent(name)}`);
    current = name;
    if (!searching) renderPicks(DOMPurify.sanitize(marked.parse(text)));
    if (lists.archived.includes(name)) $("#archivedBox").open = true;
    updateView();
    if (!searching) loadPlaylist(name);
  }

  function fillList(el, names) {
    el.replaceChildren(...names.map((n) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.textContent = niceName(n);
      b.dataset.name = n;
      b.onclick = () => { clearSearch(false); showPick(n); };
      li.append(b);
      return li;
    }));
  }

  async function loadHistory(showNewest, next) {
    lists = await api("/api/picks");
    searchIndex = null;
    fillList($("#history"), lists.active);
    if (!lists.active.length) $("#history").innerHTML = '<li class="empty">Nothing yet.</li>';
    fillList($("#archived"), lists.archived);
    $("#archivedCount").textContent = lists.archived.length;
    $("#archivedBox").hidden = !lists.archived.length;
    const exists = (n) => n && (lists.active.includes(n) || lists.archived.includes(n));
    const target = !showNewest && exists(next) ? next
      : !showNewest && next === undefined && exists(current) ? current
      : lists.active[0];
    await showPick(target);
    if (searching) await runSearch();
  }

  // Archive hides a list from "Earlier picks" (it still counts as suggested, so nothing repeats).
  // Only archived lists can be deleted. Marks live separately, so deleting a list keeps them.
  async function act(path, method, next) {
    if (method !== "POST" || path.endsWith("/archive")) {  // archiving or deleting removes the previews
      if (queue && queue.name === current) closePlayer();
    }
    try {
      await api(path, { method });
      await loadHistory(false, next);
    } catch (e) { setStatus(e.message, true); }
  }
  const neighbour = (names, n) => {
    const i = names.indexOf(n);
    return names[i + 1] ?? names[i - 1] ?? null;
  };
  $("#archiveBtn").onclick = () =>
    act(`/api/picks/${encodeURIComponent(current)}/archive`, "POST", neighbour(lists.active, current));
  $("#restoreBtn").onclick = () =>
    act(`/api/picks/${encodeURIComponent(current)}/restore`, "POST", current);
  $("#deleteBtn").onclick = () => {
    if (!confirm(`Permanently delete the list from ${niceName(current)}? This can’t be undone. Your Got, ♥ and Pass marks are kept.`)) return;
    act(`/api/picks/${encodeURIComponent(current)}`, "DELETE", neighbour(lists.archived, current) ?? lists.active[0] ?? null);
  };

  // Search every list, active and archived, for rows matching all the words typed.
  const fold = (t) => t.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();

  async function getSearchIndex() {
    if (searchIndex) return searchIndex;
    const runs = await api("/api/search-index");
    searchIndex = [];
    for (const run of runs) {
      const div = document.createElement("div");
      div.innerHTML = DOMPurify.sanitize(marked.parse(run.text));
      div.querySelectorAll("table").forEach((table) => {
        const heads = [...table.querySelectorAll("thead th")].map((th) => th.textContent.trim());
        table.querySelectorAll("tbody tr").forEach((tr) =>
          searchIndex.push({ ...run, heads, cells: [...tr.children], text: fold(tr.textContent) }));
      });
    }
    return searchIndex;
  }

  let searchToken = 0;
  async function runSearch() {
    const q = $("#search").value.trim();
    if (!q) { clearSearch(); return; }
    const token = ++searchToken;
    searching = true;
    let index;
    try { index = await getSearchIndex(); }
    catch (e) { setStatus(`Search failed: ${e.message}`, true); return; }
    if (token !== searchToken || !searching) return;  // a newer search (or a clear) won

    const words = fold(q).split(/\s+/);
    const hits = index.filter((r) => words.every((w) => r.text.includes(w)));
    $("#picksMeta").textContent =
      `${hits.length} ${hits.length === 1 ? "album" : "albums"} matching “${q}” across all lists`;
    updateView();
    if (!hits.length) { $("#picks").innerHTML = '<p class="empty">No picks match.</p>'; return; }

    // One table: the columns of every matching list (by name), plus where each row came from.
    const cols = [];
    hits.forEach((r) => r.heads.forEach((h) => { if (!cols.some((c) => c.toLowerCase() === h.toLowerCase())) cols.push(h); }));
    const table = document.createElement("table");
    const headRow = table.createTHead().insertRow();
    [...cols, "From"].forEach((c) => headRow.append(Object.assign(document.createElement("th"), { textContent: c })));
    const body = table.createTBody();
    for (const r of hits) {
      const tr = body.insertRow();
      for (const c of cols) {
        const i = r.heads.findIndex((h) => h.toLowerCase() === c.toLowerCase());
        const td = i >= 0 && r.cells[i] ? r.cells[i].cloneNode(true) : document.createElement("td");
        tr.append(td);
      }
      const from = tr.insertCell();
      from.className = "from";
      const b = Object.assign(document.createElement("button"), {
        className: "link", textContent: niceName(r.name) + (r.archived ? " (archived)" : ""),
      });
      b.onclick = () => { clearSearch(false); showPick(r.name); };
      from.append(b);
    }
    renderPicks(table);
  }

  function clearSearch(showCurrent = true) {
    if (!searching && !$("#search").value) return;
    searchToken++;
    searching = false;
    $("#search").value = "";
    if (showCurrent) showPick(current);
  }

  // --- Preview playlist: a couple of songs per pick, downloaded by the server after each run ---
  let playlist = null;      // the playlist for the list being shown
  let playlistTimer = null;
  let queue = null;         // what the player is playing: { name, tracks, i }
  const audio = $("#audio");
  const previewUrl = (name, file) => `/api/previews/${encodeURIComponent(name)}/${encodeURIComponent(file)}`;

  async function loadPlaylist(name) {
    clearTimeout(playlistTimer);
    let pl;
    try { pl = await api(`/api/picks/${encodeURIComponent(name)}/playlist`); }
    catch { return; }
    if (name !== current || searching) return;  // the page moved on while this loaded
    playlist = { name, ...pl };
    renderPreviewBar();
    renderSongs();
    addPlayLinks();
    highlightPlaying();
    if (pl.state === "building") playlistTimer = setTimeout(() => loadPlaylist(name), 4000);
  }

  function renderPreviewBar() {
    const pl = playlist, n = pl.tracks.length;
    const albums = new Set(pl.tracks.map((t) => markKey(t.artist, t.album))).size;
    const building = pl.state === "building", p = pl.progress || {};
    $("#plCount").textContent = n ? `${n} ${n === 1 ? "song" : "songs"} · ${albums} ${albums === 1 ? "album" : "albums"}` : "";
    $("#previewMsg").textContent =
      building ? (p.total ? `Downloading album ${Math.min(p.done + 1, p.total)} of ${p.total}…` : "Getting started…")
      : pl.state === "failed" ? `Couldn’t make the playlist: ${pl.error || "unknown error"}`
      : pl.state === "none" ? "No preview playlist for this list yet."
      : n ? "" : "No previews found for these albums.";
    $("#plProgress").hidden = !building;
    $("#plProgress span").style.width = p.total ? `${(100 * p.done) / p.total}%` : "0";
    $("#playAllBtn").hidden = !n;
    $("#playAllBtn").textContent = `▶ Play all${building ? " so far" : ""}`;
    $("#makePlaylistBtn").hidden = building;
    $("#makePlaylistBtn").textContent = pl.state === "done" ? "Remake playlist" : "Make playlist";
    $("#playlistBox").hidden = false;
  }

  // The playlist's songs grouped by album, each playable on its own.
  // Marked albums get a tag (and Got/Pass ones are dimmed); the playing song shows moving bars.
  const MARK_LABEL = { got: "Got", love: "♥", pass: "Pass" };

  function renderSongs() {
    const pl = playlist, groups = [];
    pl.tracks.forEach((t, i) => {
      const key = markKey(t.artist, t.album);
      let g = groups.at(-1);
      if (!g || g.key !== key) groups.push((g = { key, artist: t.artist, album: t.album, items: [] }));
      g.items.push([t, i]);
    });
    const items = groups.map((g) => {
      const li = document.createElement("li");
      li.dataset.key = g.key;
      li.innerHTML = `<img class="cover" alt="" loading="lazy" decoding="async"><div class="album-body"><div class="album-head"><span class="names"><span class="al"></span><span class="ar"></span></span><span class="tag" hidden></span></div><ol class="tracks"></ol></div>`;
      const first = g.items[0][0], cover = li.querySelector(".cover");
      cover.onerror = () => cover.removeAttribute("src");  // leaves the grey placeholder square
      cover.src = first.art || `https://i.ytimg.com/vi/${first.video_id}/hqdefault.jpg`;
      li.querySelector(".al").textContent = g.album;
      li.querySelector(".ar").textContent = g.artist;
      li.querySelector(".tracks").append(...g.items.map(([t, i]) => {
        const row = document.createElement("li");
        row.dataset.i = i;
        row.innerHTML = `<button type="button"><span class="n">${i + 1}</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="t"></span></button>`;
        row.querySelector(".t").textContent = t.title;
        row.querySelector("button").title = `${t.title} · ${t.artist}`;
        row.querySelector("button").onclick = () => startQueue(pl.name, pl.tracks, i, g.key);
        return row;
      }));
      return li;
    });
    const note = (text) => Object.assign(document.createElement("li"), { className: "note", textContent: text });
    for (const m of pl.missing) items.push(note(`Not found: ${m.album} · ${m.artist}`));
    for (const m of pl.skipped || []) items.push(note(`Left out, already marked: ${m.album} · ${m.artist}`));
    $("#songs").replaceChildren(...items);
    $("#songs").hidden = !items.length;
    markSongs();
  }

  function markSongs() {
    const playing = queue && playlist && queue.name === playlist.name ? queue.tracks[queue.i] : null;
    $("#songs").querySelectorAll(":scope > li[data-key]").forEach((li) => {
      const mark = marks[li.dataset.key], tag = li.querySelector(".tag");
      li.classList.toggle("is-marked", mark === "got" || mark === "pass");
      tag.hidden = !mark;
      tag.textContent = MARK_LABEL[mark] || "";
      tag.dataset.mark = mark || "";
    });
    $("#songs").querySelectorAll(".tracks li").forEach((row) => {
      const isCurrent = !!playing && playing.file === playlist.tracks[row.dataset.i].file;
      if (isCurrent && !row.classList.contains("is-current")) keepInView(row);
      row.classList.toggle("is-current", isCurrent);
    });
  }

  // Scroll the song list (not the page) so the playing song is visible.
  function keepInView(row) {
    const box = $("#songs"), top = row.offsetTop - box.offsetTop, bottom = top + row.offsetHeight;
    if (top < box.scrollTop) box.scrollTop = top - 24;  // leave room for its album heading
    else if (bottom > box.scrollTop + box.clientHeight) box.scrollTop = bottom - box.clientHeight + 8;
  }

  // A "▶ Play" link in each row's Listen cell, for albums that have previews.
  function addPlayLinks() {
    $("#picks").querySelectorAll("tbody tr").forEach((tr) => {
      const key = tr.dataset.key, cell = tr.querySelector("td.listen");
      if (!key || !cell || cell.querySelector(".play")) return;
      const i = playlist.tracks.findIndex((t) => markKey(t.artist, t.album) === key);
      if (i < 0) return;
      const b = Object.assign(document.createElement("button"), { className: "link play", textContent: "▶ Play" });
      b.setAttribute("aria-label", `Play previews from ${tr.dataset.album} by ${tr.dataset.artist}`);
      b.onclick = () => startQueue(playlist.name, playlist.tracks, i, key);
      cell.append(" · ", b);
    });
  }

  // Albums marked Got or Pass are skipped as the queue moves on, including ones marked mid-listen.
  // The album chosen with a row's ▶ Play ("pinned") plays even if it's marked.
  const skippable = (t) => queue.pinned !== markKey(t.artist, t.album)
    && ["got", "pass"].includes(marks[markKey(t.artist, t.album)]);

  function startQueue(name, tracks, i = 0, pinned = null) {
    queue = { name, tracks: [...tracks], i, pinned };
    while (queue.i < queue.tracks.length && skippable(queue.tracks[queue.i])) queue.i++;
    if (queue.i >= queue.tracks.length) {
      queue = null;
      $("#previewMsg").textContent = "Every album with previews here is marked Got or Pass.";
      return;
    }
    playCurrent();
  }

  function playCurrent() {
    const t = queue.tracks[queue.i];
    audio.src = previewUrl(queue.name, t.file);
    audio.play().catch(() => {});
    $("#npTitle").textContent = `${t.title} — ${t.artist}`;
    $("#npSub").textContent = `From ${t.album} · ${queue.i + 1} of ${queue.tracks.length} · ${niceName(queue.name)}`;
    $("#player").hidden = false;
    document.body.classList.add("has-player");
    highlightPlaying();
    // Older playlists have no art saved; the YouTube thumbnail stands in.
    const art = t.art || `https://i.ytimg.com/vi/${t.video_id}/hqdefault.jpg`;
    $("#npArt").src = art;
    $("#npArt").hidden = false;
    $("#npArt").onerror = () => { $("#npArt").hidden = true; };
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title, artist: t.artist, album: t.album, artwork: [{ src: art, sizes: "250x250" }],
      });
    }
    scrobbleStart(queue.name, t);
  }

  // Scrobbling: the server passes these on to ListenBrainz when it's on in Settings.
  // A song counts as a listen once you've heard half of it or 4 minutes, the usual rule.
  // Only time actually played counts, so skipping ahead doesn't scrobble.
  let listen = null;  // { name, file, startedAt, heard, last, sent }

  function sendScrobble(kind) {
    if (!listen) return;
    fetch("/api/scrobble", {
      method: "POST", keepalive: true, headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: listen.name, file: listen.file, kind, listened_at: listen.startedAt }),
    }).catch(() => {});
  }

  function scrobbleStart(name, t) {
    listen = { name, file: t.file, startedAt: Math.floor(Date.now() / 1000), heard: 0, last: null, sent: false };
    sendScrobble("playing_now");
  }

  audio.addEventListener("timeupdate", () => {
    if (!listen || listen.sent || audio.paused) return;
    const now = audio.currentTime;
    if (listen.last !== null && now > listen.last && now - listen.last < 2) listen.heard += now - listen.last;
    listen.last = now;
    const length = audio.duration;
    if (length && isFinite(length) && length >= 30 && listen.heard >= Math.min(length / 2, 240)) {
      listen.sent = true;
      sendScrobble("single");
    }
  });
  audio.addEventListener("seeking", () => listen && (listen.last = null));

  function step(delta) {
    if (!queue) return;
    let i = queue.i + delta;
    while (i >= 0 && i < queue.tracks.length && skippable(queue.tracks[i])) i += delta;
    if (i < 0 || i >= queue.tracks.length) return;
    queue.i = i;
    playCurrent();
  }

  function highlightPlaying() {
    const t = queue && queue.name === current && !searching ? queue.tracks[queue.i] : null;
    const key = t ? markKey(t.artist, t.album) : null;
    $("#picks").querySelectorAll("tbody tr").forEach((tr) => tr.classList.toggle("is-playing", !!key && tr.dataset.key === key));
    if (playlist) markSongs();
  }

  function closePlayer() {
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    queue = null;
    listen = null;
    $("#player").hidden = true;
    document.body.classList.remove("has-player");
    highlightPlaying();
  }

  audio.addEventListener("ended", () => step(1));
  audio.addEventListener("pause", () => document.body.classList.add("is-paused"));
  audio.addEventListener("play", () => document.body.classList.remove("is-paused"));
  $("#prevBtn").onclick = () => step(-1);
  $("#nextBtn").onclick = () => step(1);
  $("#closePlayer").onclick = closePlayer;
  $("#playAllBtn").onclick = () => playlist && startQueue(playlist.name, playlist.tracks, 0);
  // Media Session: lets the OS (Windows media flyout, taskbar widgets, media keys, lock screens)
  // show what's playing and control it. Browsers only offer it on secure pages (HTTPS or localhost).
  if ("mediaSession" in navigator) {
    const ms = navigator.mediaSession;
    const handlers = {
      play: () => audio.play(),
      pause: () => audio.pause(),
      stop: closePlayer,
      previoustrack: () => step(-1),
      nexttrack: () => step(1),
      seekbackward: (d) => (audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10))),
      seekforward: (d) => (audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (d.seekOffset || 10))),
      seekto: (d) => (audio.currentTime = d.seekTime),
    };
    for (const [action, fn] of Object.entries(handlers)) {
      try { ms.setActionHandler(action, fn); } catch {}  // not every browser knows every action
    }
    const syncPosition = () => {
      if (!audio.duration || !isFinite(audio.duration)) return;
      try { ms.setPositionState({ duration: audio.duration, position: Math.min(audio.currentTime, audio.duration), playbackRate: audio.playbackRate }); } catch {}
    };
    audio.addEventListener("play", () => { ms.playbackState = "playing"; syncPosition(); });
    audio.addEventListener("pause", () => { ms.playbackState = queue ? "paused" : "none"; syncPosition(); });
    audio.addEventListener("loadedmetadata", syncPosition);
    audio.addEventListener("seeked", syncPosition);
    audio.addEventListener("ratechange", syncPosition);
  }

  $("#makePlaylistBtn").onclick = async () => {
    if (!playlist) return;
    if (playlist.state === "done" && !confirm("Make this list’s preview playlist again? The current songs are deleted and downloaded fresh.")) return;
    if (queue && queue.name === playlist.name) closePlayer();
    try {
      await api(`/api/picks/${encodeURIComponent(playlist.name)}/playlist`, { method: "POST" });
      loadPlaylist(playlist.name);
    } catch (e) { $("#previewMsg").textContent = e.message; }
  };

  let searchTimer = null;
  $("#search").addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => ($("#search").value.trim() ? runSearch() : clearSearch()), 150);
  });
  $("#search").addEventListener("keydown", (e) => { if (e.key === "Escape") clearSearch(); });

  async function checkState() {
    const st = await api("/api/state");
    const btn = $("#runBtn");
    if (st.running) {
      btn.disabled = true;
      btn.classList.add("busy");
      const s = Math.floor(Date.now() / 1000 - st.started);
      setStatus(`Digging… ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}. This usually takes a few minutes.`);
      if (!poll) poll = setInterval(checkState, 3000);
      return;
    }
    btn.disabled = false;
    btn.classList.remove("busy");
    if (poll) {
      clearInterval(poll);
      poll = null;
      if (st.error) setStatus(st.error, true);
      else {
        setStatus("Done. New picks are below.");
        clearSearch(false);
        await loadHistory(true);
      }
    }
  }

  $("#runBtn").onclick = async () => {
    setStatus("Starting…");
    try { await api("/api/run", { method: "POST" }); await checkState(); }
    catch (e) { setStatus(e.message, true); }
  };

  // "Next run" under the button. The schedule itself is set on the settings page.
  async function loadNextRun() {
    const s = await api("/api/schedule");
    $("#nextRunText").textContent = s.next
      ? "Next run " + new Date(s.next).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) + " ·"
      : "";
  }

  // Notice runs started by the schedule (or another tab), and keep "Next run" current.
  setInterval(() => {
    if (!poll) checkState().catch(() => {});
    loadNextRun().catch(() => {});
  }, 60000);

  (async () => {
    try {
      loadNextRun().catch(() => {});
      marks = await api("/api/marks");
      await loadHistory(false);
      await checkState();
    } catch (e) { setStatus(`Couldn’t reach the server: ${e.message}`, true); }
  })();
</script>
</body>
</html>
