  <g transform="translate(256 222)">
    <circle r="168" fill="#141414"/>
    <circle r="146" fill="none" stroke="#2b2b28" stroke-width="3"/>
    <circle r="124" fill="none" stroke="#2b2b28" stroke-width="3"/>
    <circle r="102" fill="none" stroke="#2b2b28" stroke-width="3"/>
    <path d="M -120 -84 A 146 146 0 0 1 -40 -140" fill="none" stroke="#4a4a45" stroke-width="6" stroke-linecap="round"/>
    <circle r="58" fill="#e4e3de"/>
