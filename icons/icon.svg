  <rect x="70" y="282" width="372" height="12" rx="6" fill="#a62626"/>
  <rect x="70" y="337" width="372" height="8" fill="#e4e3de"/>
  <rect x="70" y="395" width="372" height="8" fill="#e4e3de"/>
